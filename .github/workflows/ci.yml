name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Checagem de tipos
        run: npm run typecheck

      # Unitários, HTTP e arquitetura. O teste com SQL real fica "skipped" aqui,
      # porque só roda quando SQL_TEST_CONNECTION_STRING está definida.
      - name: Testes
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Imagem no Docker Hub
    needs: test
    # em pull request só testa; a imagem é publicada no push para a main (ou manualmente)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      # Sem os secrets (um fork, por exemplo) o job não falha: avisa e pula a publicação.
      - name: Conferir credenciais do Docker Hub
        id: credentials
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::warning::Secrets DOCKERHUB_USERNAME e DOCKERHUB_TOKEN não configurados. A imagem não foi publicada."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.credentials.outputs.available == 'true'

      - uses: docker/setup-buildx-action@v3
        if: steps.credentials.outputs.available == 'true'

      - uses: docker/login-action@v3
        if: steps.credentials.outputs.available == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        if: steps.credentials.outputs.available == 'true'
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/pjbl-ms-pedidos:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/pjbl-ms-pedidos:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/pjbl-ms-pedidos:sha-${{ steps.credentials.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
